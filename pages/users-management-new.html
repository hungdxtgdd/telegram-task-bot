<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý User - Task Management System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👥</text></svg>">
    <!-- CoreUI CSS -->
    <link href="https://cdn.jsdelivr.net/npm/@coreui/coreui@4.3.2/dist/css/coreui.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .role-admin { background-color: var(--error-100); color: var(--error-800); }
        .role-manager { background-color: var(--primary-100); color: var(--primary-800); }
        .role-member { background-color: var(--success-100); color: var(--success-800); }
        .status-active { background-color: var(--success-100); color: var(--success-800); }
        .status-inactive { background-color: var(--gray-100); color: var(--gray-600); }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h4 class="text-white">Task Manager</h4>
            </div>
            <nav class="sidebar-nav">
                <ul class="nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">
                            <i class="nav-icon fas fa-tachometer-alt"></i>
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/okrs">
                            <i class="nav-icon fas fa-bullseye"></i>
                            OKRs
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/projects">
                            <i class="nav-icon fas fa-folder"></i>
                            Projects
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/tasks">
                            <i class="nav-icon fas fa-tasks"></i>
                            Tasks
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/users">
                            <i class="nav-icon fas fa-users"></i>
                            Users
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        
        <!-- Main Content -->
        <div class="main">
            <!-- Header -->
            <header class="header">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-6">
                            <button class="sidebar-toggler">
                                <i class="fas fa-bars"></i>
                            </button>
                        </div>
                        <div class="col-6 text-right">
                            <span class="text-muted">Welcome, Admin</span>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- Content -->
            <main class="content">
                <div class="container-fluid">
                    <!-- Breadcrumb -->
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
                            <li class="breadcrumb-item active">Users</li>
                        </ol>
                    </nav>
                    
                    <!-- Page Title -->
                    <div class="row">
                        <div class="col-12">
                            <h1>Quản lý Users</h1>
                        </div>
                    </div>
                        <div class="flex items-center">
                            <h1 class="text-2xl font-bold text-gray-900">
                                <i class="fas fa-users mr-2 text-primary-600"></i>
                                Quản lý User
                            </h1>
                        </div>
                        <div class="flex items-center space-x-4">
                            <button onclick="showAddUserModal()" class="btn btn-primary">
                                <i class="fas fa-plus mr-2"></i>
                                Thêm User
                            </button>
                            <button onclick="logout()" class="btn-icon">
                                <i class="fas fa-sign-out-alt text-xl"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="p-4 lg:p-8">
                <!-- Stats Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="card">
                        <div class="card-body">
                            <div class="flex items-center">
                                <div class="w-12 h-12 bg-primary-100 rounded-lg flex items-center justify-center">
                                    <i class="fas fa-users text-primary-600 text-xl"></i>
                                </div>
                                <div class="ml-4">
                                    <p class="text-sm font-medium text-gray-500">Tổng Users</p>
                                    <p class="text-2xl font-bold text-gray-900" id="totalUsers">0</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-body">
                            <div class="flex items-center">
                                <div class="w-12 h-12 bg-success-100 rounded-lg flex items-center justify-center">
                                    <i class="fas fa-user-check text-success-600 text-xl"></i>
                                </div>
                                <div class="ml-4">
                                    <p class="text-sm font-medium text-gray-500">Active</p>
                                    <p class="text-2xl font-bold text-gray-900" id="activeUsers">0</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-body">
                            <div class="flex items-center">
                                <div class="w-12 h-12 bg-warning-100 rounded-lg flex items-center justify-center">
                                    <i class="fas fa-user-shield text-warning-600 text-xl"></i>
                                </div>
                                <div class="ml-4">
                                    <p class="text-sm font-medium text-gray-500">Admins</p>
                                    <p class="text-2xl font-bold text-gray-900" id="adminUsers">0</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-body">
                            <div class="flex items-center">
                                <div class="w-12 h-12 bg-secondary-100 rounded-lg flex items-center justify-center">
                                    <i class="fas fa-user-tie text-secondary-600 text-xl"></i>
                                </div>
                                <div class="ml-4">
                                    <p class="text-sm font-medium text-gray-500">Managers</p>
                                    <p class="text-2xl font-bold text-gray-900" id="managerUsers">0</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                    <!-- Filter Bar -->
                    <div class="card mb-4">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="input-group">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text">
                                                <i class="fas fa-search"></i>
                                            </span>
                                        </div>
                                        <input type="text" class="form-control" placeholder="Tìm kiếm users..." id="searchInput">
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <select class="form-control" id="roleFilter">
                                        <option value="">Tất cả roles</option>
                                        <option value="admin">Admin</option>
                                        <option value="manager">Manager</option>
                                        <option value="member">Member</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <select class="form-control" id="statusFilter">
                                        <option value="">Tất cả status</option>
                                        <option value="active">Active</option>
                                        <option value="inactive">Inactive</option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <button class="btn btn-primary" onclick="addUser()">
                                        <i class="fas fa-plus"></i> Thêm User
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                <!-- Users Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="usersGrid">
                    <!-- User cards will be loaded here -->
                </div>
                
                <!-- Infinite Scroll Container -->
                <div id="infiniteScrollContainer" class="mt-8">
                    <!-- Infinite scroll loading will be added here -->
                </div>

                <!-- Loading State -->
                <div id="loadingState" class="text-center py-12">
                    <div class="inline-flex items-center px-4 py-2 font-semibold leading-6 text-sm shadow rounded-md text-gray-500 bg-white transition ease-in-out duration-150 cursor-not-allowed">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Đang tải users...
                    </div>
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="text-center py-12 hidden">
                    <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-users text-4xl text-gray-400"></i>
                    </div>
                    <h3 class="text-lg font-medium text-gray-900 mb-2">Không có users nào</h3>
                    <p class="text-gray-500 mb-6">Bắt đầu bằng cách thêm user đầu tiên.</p>
                    <button onclick="showAddUserModal()" class="btn btn-primary">
                        <i class="fas fa-plus mr-2"></i>
                        Thêm User
                    </button>
                </div>
            </main>
        </div>
    </div>

    <!-- Floating Action Button -->
    <div class="fixed bottom-6 right-6 z-40">
        <div class="flex flex-col space-y-3">
            <!-- Voice Notes FAB -->
            <button onclick="showVoiceNotes()" class="w-14 h-14 bg-secondary-600 text-white rounded-full shadow-lg hover:bg-secondary-700 transition-all duration-300 hover:scale-110" title="Ghi âm ghi chú">
                <i class="fas fa-microphone text-xl"></i>
            </button>
            
            <!-- Camera FAB -->
            <button onclick="showCamera()" class="w-14 h-14 bg-primary-600 text-white rounded-full shadow-lg hover:bg-primary-700 transition-all duration-300 hover:scale-110" title="Chụp ảnh">
                <i class="fas fa-camera text-xl"></i>
            </button>
            
            <!-- Main FAB -->
            <button onclick="toggleFABMenu()" class="w-16 h-16 bg-primary-600 text-white rounded-full shadow-lg hover:bg-primary-700 transition-all duration-300 hover:scale-110" title="Thêm mới">
                <i class="fas fa-plus text-2xl" id="fabIcon"></i>
            </button>
        </div>
    </div>

    <!-- Add User Modal -->
    <div id="addUserModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full">
                <div class="flex items-center justify-between p-6 border-b border-gray-200">
                    <h2 class="text-xl font-semibold text-gray-900">Thêm User Mới</h2>
                    <button onclick="closeAddUserModal()" class="btn-icon">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                
                <form id="addUserForm" class="p-6 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Tên đầy đủ</label>
                        <input type="text" id="fullName" class="input" placeholder="Nhập tên đầy đủ" required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" id="email" class="input" placeholder="Nhập email" required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Role</label>
                        <select id="role" class="select" required>
                            <option value="">Chọn role</option>
                            <option value="member">Member</option>
                            <option value="manager">Manager</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Unit</label>
                        <input type="text" id="unit" class="input" placeholder="Nhập unit">
                    </div>
                    
                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" onclick="closeAddUserModal()" class="btn btn-ghost">
                            Hủy
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-plus mr-2"></i>
                            Thêm User
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div id="editUserModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full">
                <div class="flex items-center justify-between p-6 border-b border-gray-200">
                    <h2 class="text-xl font-semibold text-gray-900">Chỉnh sửa User</h2>
                    <button onclick="closeEditUserModal()" class="btn-icon">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                
                <form id="editUserForm" class="p-6 space-y-4">
                    <input type="hidden" id="editUserId">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Tên đầy đủ</label>
                        <input type="text" id="editFullName" class="input" placeholder="Nhập tên đầy đủ" required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" id="editEmail" class="input" placeholder="Nhập email" required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Role</label>
                        <select id="editRole" class="select" required>
                            <option value="">Chọn role</option>
                            <option value="member">Member</option>
                            <option value="manager">Manager</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Unit</label>
                        <input type="text" id="editUnit" class="input" placeholder="Nhập unit">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
                        <select id="editStatus" class="select" required>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    
                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" onclick="closeEditUserModal()" class="btn btn-ghost">
                            Hủy
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save mr-2"></i>
                            Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Include Components -->
    <script>
        // Mobile navigation and sidebar are now handled by CoreUI layout
        // No need to fetch external components

        // Load keyboard shortcuts
        fetch('/components/ui/keyboard-shortcuts.html')
            .then(response => response.text())
            .then(html => {
                document.body.insertAdjacentHTML('beforeend', html);
            });

        // Load camera integration
        fetch('/components/ui/camera-integration.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('camera-integration-container').innerHTML = html;
            });

        // Load voice notes
        fetch('/components/ui/voice-notes.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('voice-notes-container').innerHTML = html;
            });
    </script>

    <!-- Load Mobile Gestures -->
    <script src="/components/ui/swipe-gestures.js"></script>
    <script src="/components/ui/pull-to-refresh.js"></script>
    <script src="/components/ui/infinite-scroll.js"></script>
    
    <!-- Load Camera and Voice Notes -->
    <div id="camera-integration-container"></div>
    <div id="voice-notes-container"></div>

    <!-- Main JavaScript -->
    <script>
        let users = [];
        let filteredUsers = [];

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadUsers();
            setupEventListeners();
            initializeInfiniteScroll();
        });

        // Load users from API
        async function loadUsers() {
            try {
                const response = await fetch('/api/users-enhanced');
                const data = await response.json();
                
                if (data.success) {
                    users = data.users || [];
                    filteredUsers = [...users];
                    renderUsers();
                    updateStats();
                } else {
                    showError('Không thể tải danh sách users: ' + data.message);
                }
            } catch (error) {
                console.error('Error loading users:', error);
                showError('Lỗi khi tải danh sách users');
            } finally {
                document.getElementById('loadingState').classList.add('hidden');
            }
        }

        // Render users grid
        function renderUsers() {
            const grid = document.getElementById('usersGrid');
            const emptyState = document.getElementById('emptyState');
            
            if (filteredUsers.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            grid.innerHTML = filteredUsers.map(user => `
                <div class="card hover:shadow-lg transition-all duration-300 user-card relative" data-user-id="${user.id}">
                    <div class="card-body">
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex items-center">
                                <div class="w-12 h-12 bg-primary-100 rounded-full flex items-center justify-center">
                                    <i class="fas fa-user text-primary-600 text-xl"></i>
                                </div>
                                <div class="ml-3">
                                    <h3 class="text-lg font-semibold text-gray-900">${user.full_name || user.name || 'N/A'}</h3>
                                    <p class="text-sm text-gray-500">${user.email || 'N/A'}</p>
                                </div>
                            </div>
                            <div class="flex space-x-1">
                                <button onclick="editUser(${user.id})" class="btn-icon" title="Chỉnh sửa">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button onclick="deleteUser(${user.id})" class="btn-icon text-error-600 hover:text-error-700" title="Xóa">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-500">Role:</span>
                                <span class="badge role-${user.role}">${user.role}</span>
                            </div>
                            
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-500">Status:</span>
                                <span class="badge status-${user.status || 'active'}">${user.status || 'active'}</span>
                            </div>
                            
                            ${user.unit ? `
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-500">Unit:</span>
                                <span class="text-sm text-gray-900">${user.unit}</span>
                            </div>
                            ` : ''}
                            
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-500">Created:</span>
                                <span class="text-sm text-gray-900">${new Date(user.created_at).toLocaleDateString('vi-VN')}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Update statistics
        function updateStats() {
            const totalUsers = users.length;
            const activeUsers = users.filter(u => u.status === 'active' || !u.status).length;
            const adminUsers = users.filter(u => u.role === 'admin').length;
            const managerUsers = users.filter(u => u.role === 'manager').length;
            
            document.getElementById('totalUsers').textContent = totalUsers;
            document.getElementById('activeUsers').textContent = activeUsers;
            document.getElementById('adminUsers').textContent = adminUsers;
            document.getElementById('managerUsers').textContent = managerUsers;
        }

        // Setup event listeners
        function setupEventListeners() {
            // Search
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', filterUsers);
            }
            
            // Filters
            const roleFilter = document.getElementById('roleFilter');
            if (roleFilter) {
                roleFilter.addEventListener('change', filterUsers);
            }
            
            const statusFilter = document.getElementById('statusFilter');
            if (statusFilter) {
                statusFilter.addEventListener('change', filterUsers);
            }
            
            // Forms
            const addUserForm = document.getElementById('addUserForm');
            if (addUserForm) {
                addUserForm.addEventListener('submit', handleAddUser);
            }
            
            const editUserForm = document.getElementById('editUserForm');
            if (editUserForm) {
                editUserForm.addEventListener('submit', handleEditUser);
            }
        }

        // Filter users
        function filterUsers() {
            const searchInput = document.getElementById('searchInput');
            const roleFilter = document.getElementById('roleFilter');
            const statusFilter = document.getElementById('statusFilter');
            
            const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
            const roleValue = roleFilter ? roleFilter.value : '';
            const statusValue = statusFilter ? statusFilter.value : '';
            
            filteredUsers = users.filter(user => {
                const matchesSearch = !searchTerm || 
                    (user.full_name && user.full_name.toLowerCase().includes(searchTerm)) ||
                    (user.email && user.email.toLowerCase().includes(searchTerm));
                
                const matchesRole = !roleValue || user.role === roleValue;
                const matchesStatus = !statusValue || (user.status || 'active') === statusValue;
                
                return matchesSearch && matchesRole && matchesStatus;
            });
            
            renderUsers();
            updateClearButton();
        }

        // Clear search
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            filterUsers();
        }

        // Clear all filters
        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('roleFilter').value = '';
            document.getElementById('statusFilter').value = '';
            filterUsers();
        }

        // Update clear button visibility
        function updateClearButton() {
            const searchInput = document.getElementById('searchInput');
            const clearButton = document.getElementById('clearSearch');
            
            if (searchInput.value) {
                clearButton.classList.remove('hidden');
            } else {
                clearButton.classList.add('hidden');
            }
        }

        // Show add user modal
        function showAddUserModal() {
            document.getElementById('addUserModal').classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
        }

        // Close add user modal
        function closeAddUserModal() {
            document.getElementById('addUserModal').classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
            document.getElementById('addUserForm').reset();
        }

        // Show edit user modal
        function editUser(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;
            
            document.getElementById('editUserId').value = user.id;
            document.getElementById('editFullName').value = user.full_name || user.name || '';
            document.getElementById('editEmail').value = user.email || '';
            document.getElementById('editRole').value = user.role || '';
            document.getElementById('editUnit').value = user.unit || '';
            document.getElementById('editStatus').value = user.status || 'active';
            
            document.getElementById('editUserModal').classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
        }

        // Close edit user modal
        function closeEditUserModal() {
            document.getElementById('editUserModal').classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
        }

        // Handle add user
        async function handleAddUser(e) {
            e.preventDefault();
            
            const formData = {
                full_name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                role: document.getElementById('role').value,
                unit: document.getElementById('unit').value
            };
            
            try {
                const response = await fetch('/api/users-enhanced', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('Thêm user thành công!');
                    closeAddUserModal();
                    loadUsers();
                } else {
                    showError('Lỗi khi thêm user: ' + data.message);
                }
            } catch (error) {
                console.error('Error adding user:', error);
                showError('Lỗi khi thêm user');
            }
        }

        // Handle edit user
        async function handleEditUser(e) {
            e.preventDefault();
            
            const userId = document.getElementById('editUserId').value;
            const formData = {
                full_name: document.getElementById('editFullName').value,
                email: document.getElementById('editEmail').value,
                role: document.getElementById('editRole').value,
                unit: document.getElementById('editUnit').value,
                status: document.getElementById('editStatus').value
            };
            
            try {
                const response = await fetch(`/api/users-enhanced/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('Cập nhật user thành công!');
                    closeEditUserModal();
                    loadUsers();
                } else {
                    showError('Lỗi khi cập nhật user: ' + data.message);
                }
            } catch (error) {
                console.error('Error updating user:', error);
                showError('Lỗi khi cập nhật user');
            }
        }

        // Delete user
        async function deleteUser(userId) {
            if (!confirm('Bạn có chắc chắn muốn xóa user này?')) return;
            
            try {
                const response = await fetch(`/api/users-enhanced/${userId}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('Xóa user thành công!');
                    loadUsers();
                } else {
                    showError('Lỗi khi xóa user: ' + data.message);
                }
            } catch (error) {
                console.error('Error deleting user:', error);
                showError('Lỗi khi xóa user');
            }
        }

        // Show success message
        function showSuccess(message) {
            // Simple success notification
            const notification = document.createElement('div');
            notification.className = 'fixed top-4 right-4 bg-success-600 text-white px-6 py-3 rounded-lg shadow-lg z-50';
            notification.innerHTML = `<i class="fas fa-check mr-2"></i>${message}`;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Show error message
        function showError(message) {
            // Simple error notification
            const notification = document.createElement('div');
            notification.className = 'fixed top-4 right-4 bg-error-600 text-white px-6 py-3 rounded-lg shadow-lg z-50';
            notification.innerHTML = `<i class="fas fa-exclamation-triangle mr-2"></i>${message}`;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Logout function
        function logout() {
            if (confirm('Bạn có chắc chắn muốn đăng xuất?')) {
                localStorage.removeItem('token');
                window.location.href = '/login.html';
            }
        }

        // Initialize infinite scroll
        function initializeInfiniteScroll() {
            const container = document.getElementById('infiniteScrollContainer');
            if (container && window.infiniteScroll) {
                window.infiniteScroll.setContainer(container);
            }
        }

        // Render items for infinite scroll
        function renderItems(newUsers) {
            const grid = document.getElementById('usersGrid');
            if (!grid) return;
            
            newUsers.forEach(user => {
                const userCard = document.createElement('div');
                userCard.className = 'card hover:shadow-lg transition-all duration-300 user-card relative infinite-scroll-item';
                userCard.setAttribute('data-user-id', user.id);
                userCard.innerHTML = `
                    <div class="card-body">
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex items-center">
                                <div class="w-12 h-12 bg-primary-100 rounded-full flex items-center justify-center">
                                    <i class="fas fa-user text-primary-600 text-xl"></i>
                                </div>
                                <div class="ml-3">
                                    <h3 class="text-lg font-semibold text-gray-900">${user.full_name || user.name || 'N/A'}</h3>
                                    <p class="text-sm text-gray-500">${user.email || 'N/A'}</p>
                                </div>
                            </div>
                            <div class="flex space-x-1">
                                <button onclick="editUser(${user.id})" class="btn-icon" title="Chỉnh sửa">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button onclick="deleteUser(${user.id})" class="btn-icon text-error-600 hover:text-error-700" title="Xóa">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-500">Role:</span>
                                <span class="badge role-${user.role}">${user.role}</span>
                            </div>
                            
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-500">Status:</span>
                                <span class="badge status-${user.status || 'active'}">${user.status || 'active'}</span>
                            </div>
                            
                            ${user.unit ? `
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-500">Unit:</span>
                                <span class="text-sm text-gray-900">${user.unit}</span>
                            </div>
                            ` : ''}
                            
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-500">Created:</span>
                                <span class="text-sm text-gray-900">${new Date(user.created_at).toLocaleDateString('vi-VN')}</span>
                            </div>
                        </div>
                    </div>
                `;
                
                grid.appendChild(userCard);
            });
        }

        // FAB Menu functions
        function toggleFABMenu() {
            const fabMenu = document.querySelector('.fixed.bottom-6.right-6 .flex.flex-col');
            const fabIcon = document.getElementById('fabIcon');
            
            if (fabMenu.classList.contains('space-y-3')) {
                fabMenu.classList.remove('space-y-3');
                fabMenu.classList.add('space-y-0');
                fabIcon.className = 'fas fa-times text-2xl';
            } else {
                fabMenu.classList.remove('space-y-0');
                fabMenu.classList.add('space-y-3');
                fabIcon.className = 'fas fa-plus text-2xl';
            }
        }

        // Camera functions
        function showCamera() {
            if (window.cameraIntegration) {
                window.cameraIntegration.showFileUpload((photoData) => {
                    console.log('Photo captured:', photoData);
                    // Handle captured photo
                    showSuccess('Đã chụp ảnh thành công!');
                });
            } else {
                showError('Camera integration chưa sẵn sàng');
            }
        }

        // Voice notes functions
        function showVoiceNotes() {
            if (window.voiceNotes) {
                window.voiceNotes.showModal((note) => {
                    console.log('Voice note saved:', note);
                    // Handle saved voice note
                    showSuccess('Đã lưu ghi chú âm thanh thành công!');
                });
            } else {
                showError('Voice notes chưa sẵn sàng');
            }
        }

        // Mobile menu functions (will be loaded from component)
        function toggleMobileMenu() {
            // This will be overridden by the mobile nav component
        }
    </script>
    
    <!-- CoreUI JS -->
    <script src="https://cdn.jsdelivr.net/npm/@coreui/coreui@4.3.2/dist/js/coreui.bundle.min.js"></script>
</body>
</html>
