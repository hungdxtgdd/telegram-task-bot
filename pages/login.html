<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Task Manager Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    <!-- CoreUI CSS -->
    <link href="https://cdn.jsdelivr.net/npm/@coreui/coreui@4.3.2/dist/css/coreui.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="app flex-row align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card-group">
                    <div class="card p-4">
                        <div class="card-body">
                            <div class="text-center mb-4">
                                <i class="fas fa-tasks fa-3x text-primary mb-3"></i>
                                <h1 class="h3 mb-3 font-weight-normal">Task Manager Dashboard</h1>
                                <p class="text-muted">Vui lòng đăng nhập để tiếp tục</p>
                            </div>
                            
                            <form id="loginForm">
                                <div class="input-group mb-3">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">
                                            <i class="fas fa-user"></i>
                                        </span>
                                    </div>
                                    <input class="form-control" type="text" id="username" placeholder="Tên đăng nhập" required autocomplete="username">
                                </div>
                                
                                <div class="input-group mb-4">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">
                                            <i class="fas fa-lock"></i>
                                        </span>
                                    </div>
                                    <input class="form-control" type="password" id="password" placeholder="Mật khẩu" required autocomplete="current-password">
                                </div>
                                
                                <div id="errorMessage" class="alert alert-danger" style="display: none;">
                                    <i class="fas fa-exclamation-triangle mr-2"></i>
                                    <span id="errorText"></span>
                                </div>
                                
                                <div class="row">
                                    <div class="col-12">
                                        <button class="btn btn-primary btn-block" type="submit" id="loginBtn">
                                            <i class="fas fa-sign-in-alt mr-2"></i>
                                            <span id="loginBtnText">Đăng nhập</span>
                                        </button>
                                    </div>
                                </div>
                            </form>
                            
                            <div class="text-center mt-4">
                                <p class="text-muted">
                                    <i class="fas fa-shield-alt mr-1"></i>
                                    Hệ thống được bảo mật
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="text-center text-white mt-3">
                    <p class="text-sm">© 2024 AVAKids Task Manager</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            
            // Disable button and show loading
            loginBtn.disabled = true;
            loginBtnText.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Đang đăng nhập...';
            errorMessage.style.display = 'none';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                console.log('Login response:', result);
                
                if (response.ok) {
                    // Store token in localStorage
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('userInfo', JSON.stringify(result.user));
                    
                    console.log('Token stored:', localStorage.getItem('token'));
                    console.log('User info stored:', localStorage.getItem('userInfo'));
                    
                    // Add small delay to ensure localStorage is synced
                    setTimeout(() => {
                        // Double-check token is still there
                        const storedToken = localStorage.getItem('token');
                        console.log('Token before redirect:', storedToken);
                        
                        if (!storedToken) {
                            console.error('Token was lost! Login failed.');
                            return;
                        }
                        
                        // Redirect to projects page for all users
                        console.log('Redirecting to projects page...');
                        window.location.href = '/projects';
                    }, 100);
                } else {
                    // Show error message
                    errorText.textContent = result.error || 'Đăng nhập thất bại';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorText.textContent = 'Lỗi kết nối. Vui lòng thử lại.';
                errorMessage.style.display = 'block';
            } finally {
                // Re-enable button
                loginBtn.disabled = false;
                loginBtnText.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Đăng nhập';
            }
        });
        
        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }
    </script>
    
    <!-- CoreUI JS -->
    <script src="https://cdn.jsdelivr.net/npm/@coreui/coreui@4.3.2/dist/js/coreui.bundle.min.js"></script>
</body>
</html>
