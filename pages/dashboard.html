<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Dashboard - AVAKids</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .priority-emergency { @apply bg-red-100 border-red-300 text-red-800; }
        .priority-high { @apply bg-red-50 border-red-200 text-red-700; }
        .priority-medium { @apply bg-yellow-50 border-yellow-200 text-yellow-700; }
        .priority-low { @apply bg-green-50 border-green-200 text-green-700; }
        .status-done { @apply bg-green-100 text-green-800; }
        .status-pending { @apply bg-yellow-100 text-yellow-800; }
        .status-progress { @apply bg-blue-100 text-blue-800; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center">
                    <i class="fas fa-tasks text-2xl text-blue-600 mr-3"></i>
                    <h1 class="text-2xl font-bold text-gray-900">Task Manager Dashboard</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-500" id="userInfo">AVAKids Team</span>
                    <button onclick="refreshData()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                        <i class="fas fa-sync-alt mr-2"></i>Refresh
                    </button>
                    <button id="manageUsersBtn" onclick="goToUsers()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition hidden">
                        <i class="fas fa-users mr-2"></i>Quản lý User
                    </button>
                    <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
                        <i class="fas fa-sign-out-alt mr-2"></i>Đăng xuất
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                        <i class="fas fa-tasks text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500">Total Tasks</p>
                        <p class="text-2xl font-semibold text-gray-900" id="totalTasks">-</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-green-100 text-green-600">
                        <i class="fas fa-check-circle text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500">Completed</p>
                        <p class="text-2xl font-semibold text-gray-900" id="completedTasks">-</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-yellow-100 text-yellow-600">
                        <i class="fas fa-clock text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500">In Progress</p>
                        <p class="text-2xl font-semibold text-gray-900" id="inProgressTasks">-</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-red-100 text-red-600">
                        <i class="fas fa-exclamation-triangle text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500">Emergency</p>
                        <p class="text-2xl font-semibold text-gray-900" id="emergencyTasks">-</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Quick Actions</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <button onclick="addNewTask()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition flex items-center justify-center">
                    <i class="fas fa-plus mr-2"></i>Add New Task
                </button>
                <button onclick="exportTasks()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition flex items-center justify-center">
                    <i class="fas fa-download mr-2"></i>Export Tasks
                </button>
                <button onclick="refreshData()" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition flex items-center justify-center">
                    <i class="fas fa-sync-alt mr-2"></i>Refresh Data
                </button>
            </div>
        </div>

        <!-- Tasks Table -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-semibold text-gray-900">All Tasks</h3>
                    <div class="flex space-x-2">
                        <select id="statusFilter" class="border border-gray-300 rounded-md px-3 py-1 text-sm">
                            <option value="">All Status</option>
                            <option value="Done">Done</option>
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                        </select>
                        <select id="priorityFilter" class="border border-gray-300 rounded-md px-3 py-1 text-sm">
                            <option value="">All Priority</option>
                            <option value="Emergency">Emergency</option>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Task</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Assignee</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Priority</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Deadline</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tasksTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Tasks will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Task Detail Modal -->
    <div id="taskModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                <div class="px-6 py-4 border-b border-gray-200">
                    <div class="flex justify-between items-center">
                        <h3 class="text-lg font-semibold text-gray-900">Task Details</h3>
                        <button onclick="closeTaskModal()" class="text-gray-400 hover:text-gray-600">
                            <i class="fas fa-times text-xl"></i>
                        </button>
                    </div>
                </div>
                <div class="px-6 py-4">
                    <div id="taskDetails" class="space-y-4">
                        <!-- Task details will be loaded here -->
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-gray-200 flex justify-end space-x-3">
                    <button onclick="closeTaskModal()" class="px-4 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300">
                        Close
                    </button>
                    <button onclick="editTaskFromModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        Edit Task
                    </button>
                    <button onclick="deleteTaskFromModal()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                        Delete Task
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Task Modal -->
    <div id="taskFormModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-lg w-full">
                <div class="px-6 py-4 border-b border-gray-200">
                    <div class="flex justify-between items-center">
                        <h3 class="text-lg font-semibold text-gray-900" id="taskFormTitle">Add New Task</h3>
                        <button onclick="closeTaskFormModal()" class="text-gray-400 hover:text-gray-600">
                            <i class="fas fa-times text-xl"></i>
                        </button>
                    </div>
                </div>
                <form id="taskForm" class="px-6 py-4 space-y-4">
                    <input type="hidden" id="taskId" value="">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Task Name *</label>
                        <input type="text" id="taskName" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <textarea id="taskDescription" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Assignee *</label>
                        <input type="text" id="taskAssignee" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Priority *</label>
                        <select id="taskPriority" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select Priority</option>
                            <option value="Emergency">🚨 Emergency</option>
                            <option value="High">🔴 High</option>
                            <option value="Medium">🟡 Medium</option>
                            <option value="Low">🟢 Low</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                        <select id="taskStatus" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="Pending">⏳ Pending</option>
                            <option value="In Progress">🔄 In Progress</option>
                            <option value="Done">✅ Done</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Deadline</label>
                        <input type="date" id="taskDeadline" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                        <textarea id="taskNotes" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Link Description</label>
                        <input type="url" id="taskLink" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </form>
                <div class="px-6 py-4 border-t border-gray-200 flex justify-end space-x-3">
                    <button onclick="closeTaskFormModal()" class="px-4 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300">
                        Cancel
                    </button>
                    <button onclick="saveTask()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        Save Task
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let tasks = [];
        let isLoading = false;
        let currentTask = null;

        // Load data on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication first
            checkAuth();
            setupEventListeners();
        });

        // Check if user is authenticated
        async function checkAuth() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = '/login';
                return;
            }

            try {
                const response = await fetch('/api/auth/verify', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('userInfo');
                    window.location.href = '/login';
                    return;
                }

                // User is authenticated, load tasks
                const userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
                document.getElementById('userInfo').textContent = userInfo.name || 'User';
                
                // Show manage users button for admin
                if (userInfo.role === 'admin') {
                    document.getElementById('manageUsersBtn').classList.remove('hidden');
                }
                
                loadTasks();
            } catch (error) {
                console.error('Auth check failed:', error);
                localStorage.removeItem('authToken');
                localStorage.removeItem('userInfo');
                window.location.href = '/login';
            }
        }

        async function loadTasks() {
            if (isLoading) return;
            
            isLoading = true;
            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch('/api/tasks', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('authToken');
                        localStorage.removeItem('userInfo');
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error('Failed to load tasks');
                }
                
                tasks = await response.json();
                updateStats();
                updateTable();
            } catch (error) {
                console.error('Error loading tasks:', error);
                alert('Error loading tasks. Please try again.');
            } finally {
                isLoading = false;
            }
        }

        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.status === 'Done').length;
            const inProgress = tasks.filter(t => t.status === 'In Progress').length;
            const emergency = tasks.filter(t => t.priority === 'Emergency').length;

            document.getElementById('totalTasks').textContent = total;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('inProgressTasks').textContent = inProgress;
            document.getElementById('emergencyTasks').textContent = emergency;
        }

        function updateTable() {
            const tbody = document.getElementById('tasksTableBody');
            const statusFilter = document.getElementById('statusFilter').value;
            const priorityFilter = document.getElementById('priorityFilter').value;
            
            let filteredTasks = tasks;
            if (statusFilter) filteredTasks = filteredTasks.filter(t => t.status === statusFilter);
            if (priorityFilter) filteredTasks = filteredTasks.filter(t => t.priority === priorityFilter);

            tbody.innerHTML = filteredTasks.map(task => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">${task.task_name}</div>
                        <div class="text-sm text-gray-500">${task.task_id}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${task.assignee}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 text-xs font-semibold rounded-full priority-${task.priority.toLowerCase()}">
                            ${getPriorityIcon(task.priority)} ${task.priority}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 text-xs font-semibold rounded-full status-${task.status.toLowerCase().replace(' ', '')}">
                            ${getStatusIcon(task.status)} ${task.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${task.deadline || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="viewTask('${task.task_id}')" class="text-blue-600 hover:text-blue-900 mr-3">View</button>
                        <button onclick="editTask('${task.task_id}')" class="text-green-600 hover:text-green-900">Edit</button>
                    </td>
                </tr>
            `).join('');
        }

        function getPriorityIcon(priority) {
            const icons = {
                'Emergency': '🚨',
                'High': '🔴',
                'Medium': '🟡',
                'Low': '🟢'
            };
            return icons[priority] || '⚪';
        }

        function getStatusIcon(status) {
            const icons = {
                'Done': '✅',
                'In Progress': '🔄',
                'Pending': '⏳'
            };
            return icons[status] || '❓';
        }

        function setupEventListeners() {
            document.getElementById('statusFilter').addEventListener('change', updateTable);
            document.getElementById('priorityFilter').addEventListener('change', updateTable);
        }

        function refreshData() {
            if (isLoading) return;
            loadTasks();
        }

        // Modal functions
        function closeTaskModal() {
            document.getElementById('taskModal').classList.add('hidden');
            currentTask = null;
        }

        function closeTaskFormModal() {
            document.getElementById('taskFormModal').classList.add('hidden');
            document.getElementById('taskForm').reset();
            currentTask = null;
        }

        function addNewTask() {
            document.getElementById('taskFormTitle').textContent = 'Add New Task';
            document.getElementById('taskForm').reset();
            document.getElementById('taskId').value = '';
            currentTask = null;
            document.getElementById('taskFormModal').classList.remove('hidden');
        }

        function viewTask(taskId) {
            const task = tasks.find(t => t.task_id === taskId);
            if (!task) return;
            
            currentTask = task;
            const details = document.getElementById('taskDetails');
            details.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm font-medium text-gray-500">Task ID</label>
                        <p class="text-lg font-semibold text-gray-900">${task.task_id}</p>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-500">Status</label>
                        <p class="text-lg"><span class="px-2 py-1 text-xs font-semibold rounded-full status-${task.status.toLowerCase().replace(' ', '')}">${getStatusIcon(task.status)} ${task.status}</span></p>
                    </div>
                    <div class="md:col-span-2">
                        <label class="text-sm font-medium text-gray-500">Task Name</label>
                        <p class="text-lg font-semibold text-gray-900">${task.task_name}</p>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-500">Assignee</label>
                        <p class="text-lg text-gray-900">${task.assignee}</p>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-500">Priority</label>
                        <p class="text-lg"><span class="px-2 py-1 text-xs font-semibold rounded-full priority-${task.priority.toLowerCase()}">${getPriorityIcon(task.priority)} ${task.priority}</span></p>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-500">Deadline</label>
                        <p class="text-lg text-gray-900">${task.deadline || 'Not set'}</p>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-500">Created</label>
                        <p class="text-lg text-gray-900">${new Date(task.created_at).toLocaleDateString()}</p>
                    </div>
                    ${task.description ? `
                    <div class="md:col-span-2">
                        <label class="text-sm font-medium text-gray-500">Description</label>
                        <p class="text-lg text-gray-900">${task.description}</p>
                    </div>
                    ` : ''}
                    ${task.notes ? `
                    <div class="md:col-span-2">
                        <label class="text-sm font-medium text-gray-500">Notes</label>
                        <p class="text-lg text-gray-900">${task.notes}</p>
                    </div>
                    ` : ''}
                    ${task.link_description ? `
                    <div class="md:col-span-2">
                        <label class="text-sm font-medium text-gray-500">Link</label>
                        <p class="text-lg"><a href="${task.link_description}" target="_blank" class="text-blue-600 hover:text-blue-800">${task.link_description}</a></p>
                    </div>
                    ` : ''}
                </div>
            `;
            document.getElementById('taskModal').classList.remove('hidden');
        }

        function editTask(taskId) {
            const task = tasks.find(t => t.task_id === taskId);
            if (!task) return;
            
            currentTask = task;
            document.getElementById('taskFormTitle').textContent = 'Edit Task';
            document.getElementById('taskId').value = task.task_id;
            document.getElementById('taskName').value = task.task_name;
            document.getElementById('taskDescription').value = task.description || '';
            document.getElementById('taskAssignee').value = task.assignee;
            document.getElementById('taskPriority').value = task.priority;
            document.getElementById('taskStatus').value = task.status;
            document.getElementById('taskDeadline').value = task.deadline || '';
            document.getElementById('taskNotes').value = task.notes || '';
            document.getElementById('taskLink').value = task.link_description || '';
            
            document.getElementById('taskFormModal').classList.remove('hidden');
        }

        function editTaskFromModal() {
            if (!currentTask) return;
            editTask(currentTask.task_id);
            closeTaskModal();
        }

        async function saveTask() {
            const form = document.getElementById('taskForm');
            const formData = new FormData(form);
            
            const taskData = {
                task_name: document.getElementById('taskName').value,
                description: document.getElementById('taskDescription').value,
                assignee: document.getElementById('taskAssignee').value,
                priority: document.getElementById('taskPriority').value,
                status: document.getElementById('taskStatus').value,
                deadline: document.getElementById('taskDeadline').value || null,
                notes: document.getElementById('taskNotes').value,
                link_description: document.getElementById('taskLink').value
            };

            if (!taskData.task_name || !taskData.assignee || !taskData.priority) {
                alert('Please fill in all required fields');
                return;
            }

            try {
                const taskId = document.getElementById('taskId').value;
                const url = taskId ? '/api/tasks' : '/api/tasks';
                const method = taskId ? 'PUT' : 'POST';
                const token = localStorage.getItem('authToken');
                
                if (taskId) {
                    taskData.task_id = taskId;
                }

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(taskData)
                });

                if (response.ok) {
                    const result = await response.json();
                    alert(taskId ? 'Task updated successfully!' : 'Task created successfully!');
                    closeTaskFormModal();
                    refreshData();
                } else {
                    const error = await response.json();
                    alert('Error: ' + (error.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error saving task');
            }
        }

        async function deleteTaskFromModal() {
            if (!currentTask) return;
            
            if (confirm(`Are you sure you want to delete task "${currentTask.task_name}"?`)) {
                try {
                    const token = localStorage.getItem('authToken');
                    const response = await fetch('/api/tasks', {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            task_id: currentTask.task_id
                        })
                    });

                    if (response.ok) {
                        alert('Task deleted successfully!');
                        closeTaskModal();
                        refreshData();
                    } else {
                        const error = await response.json();
                        alert('Error: ' + (error.error || 'Unknown error'));
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error deleting task');
                }
            }
        }

        function exportTasks() {
            const csvContent = "data:text/csv;charset=utf-8," + 
                "Task ID,Task Name,Assignee,Priority,Status,Deadline,Description,Notes,Link\n" +
                tasks.map(task => 
                    `"${task.task_id}","${task.task_name}","${task.assignee}","${task.priority}","${task.status}","${task.deadline || ''}","${task.description || ''}","${task.notes || ''}","${task.link_description || ''}"`
                ).join("\n");
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "tasks_export.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function goToUsers() {
            window.location.href = '/users';
        }

        function logout() {
            if (confirm('Bạn có chắc chắn muốn đăng xuất?')) {
                localStorage.removeItem('authToken');
                localStorage.removeItem('userInfo');
                window.location.href = '/login';
            }
        }
    </script>
</body>
</html>
