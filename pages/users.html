<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý User - Task Manager Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .role-admin { @apply bg-red-100 text-red-800 border-red-200; }
        .role-user { @apply bg-blue-100 text-blue-800 border-blue-200; }
        .status-active { @apply bg-green-100 text-green-800; }
        .status-inactive { @apply bg-gray-100 text-gray-800; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center">
                    <i class="fas fa-users text-2xl text-blue-600 mr-3"></i>
                    <h1 class="text-2xl font-bold text-gray-900">Quản lý User</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-500" id="userInfo">User</span>
                    <a href="/dashboard" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition">
                        <i class="fas fa-arrow-left mr-2"></i>Về Dashboard
                    </a>
                    <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
                        <i class="fas fa-sign-out-alt mr-2"></i>Đăng xuất
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                        <i class="fas fa-users text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500">Tổng User</p>
                        <p class="text-2xl font-semibold text-gray-900" id="totalUsers">-</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-green-100 text-green-600">
                        <i class="fas fa-user-check text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500">User Hoạt động</p>
                        <p class="text-2xl font-semibold text-gray-900" id="activeUsers">-</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-red-100 text-red-600">
                        <i class="fas fa-user-shield text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500">Admin</p>
                        <p class="text-2xl font-semibold text-gray-900" id="adminUsers">-</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Thao tác nhanh</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="addNewUser()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition flex items-center justify-center">
                    <i class="fas fa-user-plus mr-2"></i>Thêm User mới
                </button>
                <button onclick="refreshUsers()" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition flex items-center justify-center">
                    <i class="fas fa-sync-alt mr-2"></i>Làm mới dữ liệu
                </button>
            </div>
        </div>

        <!-- Users Table -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-semibold text-gray-900">Danh sách User</h3>
                    <div class="flex space-x-2">
                        <select id="roleFilter" class="border border-gray-300 rounded-md px-3 py-1 text-sm">
                            <option value="">Tất cả Role</option>
                            <option value="admin">Admin</option>
                            <option value="user">User</option>
                        </select>
                        <select id="statusFilter" class="border border-gray-300 rounded-md px-3 py-1 text-sm">
                            <option value="">Tất cả Trạng thái</option>
                            <option value="true">Hoạt động</option>
                            <option value="false">Vô hiệu hóa</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Trạng thái</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Lần đăng nhập cuối</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Users will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- User Detail Modal -->
    <div id="userModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                <div class="px-6 py-4 border-b border-gray-200">
                    <div class="flex justify-between items-center">
                        <h3 class="text-lg font-semibold text-gray-900">Chi tiết User</h3>
                        <button onclick="closeUserModal()" class="text-gray-400 hover:text-gray-600">
                            <i class="fas fa-times text-xl"></i>
                        </button>
                    </div>
                </div>
                <div class="px-6 py-4">
                    <div id="userDetails" class="space-y-4">
                        <!-- User details will be loaded here -->
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-gray-200 flex justify-end space-x-3">
                    <button onclick="closeUserModal()" class="px-4 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300">
                        Đóng
                    </button>
                    <button onclick="editUserFromModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        Chỉnh sửa
                    </button>
                    <button onclick="deleteUserFromModal()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                        Xóa User
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit User Modal -->
    <div id="userFormModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-lg w-full">
                <div class="px-6 py-4 border-b border-gray-200">
                    <div class="flex justify-between items-center">
                        <h3 class="text-lg font-semibold text-gray-900" id="userFormTitle">Thêm User mới</h3>
                        <button onclick="closeUserFormModal()" class="text-gray-400 hover:text-gray-600">
                            <i class="fas fa-times text-xl"></i>
                        </button>
                    </div>
                </div>
                <form id="userForm" class="px-6 py-4 space-y-4">
                    <input type="hidden" id="userId" value="">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Username *</label>
                        <input type="text" id="userUsername" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Họ tên *</label>
                        <input type="text" id="userFullName" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="userEmail" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Role *</label>
                        <select id="userRole" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Chọn Role</option>
                            <option value="admin">Admin</option>
                            <option value="user">User</option>
                        </select>
                    </div>
                    <div id="passwordFields">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu *</label>
                        <input type="password" id="userPassword" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <p class="text-xs text-gray-500 mt-1">Để trống nếu không muốn thay đổi mật khẩu</p>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" id="userIsActive" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <label for="userIsActive" class="ml-2 block text-sm text-gray-900">
                            Tài khoản hoạt động
                        </label>
                    </div>
                </form>
                <div class="px-6 py-4 border-t border-gray-200 flex justify-end space-x-3">
                    <button onclick="closeUserFormModal()" class="px-4 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300">
                        Hủy
                    </button>
                    <button onclick="saveUser()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        Lưu User
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let users = [];
        let isLoading = false;
        let currentUser = null;

        // Load data on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            setupEventListeners();
        });

        // Check if user is authenticated
        async function checkAuth() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = '/login';
                return;
            }

            try {
                const response = await fetch('/api/auth/verify', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('userInfo');
                    window.location.href = '/login';
                    return;
                }

                const userInfo = await response.json();
                
                // Check if user is admin
                if (userInfo.user.role !== 'admin') {
                    alert('Bạn không có quyền truy cập trang này!');
                    window.location.href = '/dashboard';
                    return;
                }

                // User is authenticated and is admin
                document.getElementById('userInfo').textContent = userInfo.user.name;
                loadUsers();
            } catch (error) {
                console.error('Auth check failed:', error);
                localStorage.removeItem('authToken');
                localStorage.removeItem('userInfo');
                window.location.href = '/login';
            }
        }

        async function loadUsers() {
            if (isLoading) return;
            
            isLoading = true;
            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch('/api/users/users', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('authToken');
                        localStorage.removeItem('userInfo');
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error('Failed to load users');
                }
                
                users = await response.json();
                updateStats();
                updateTable();
            } catch (error) {
                console.error('Error loading users:', error);
                alert('Lỗi khi tải danh sách user. Vui lòng thử lại.');
            } finally {
                isLoading = false;
            }
        }

        function updateStats() {
            const total = users.length;
            const active = users.filter(u => u.is_active).length;
            const admin = users.filter(u => u.role === 'admin').length;

            document.getElementById('totalUsers').textContent = total;
            document.getElementById('activeUsers').textContent = active;
            document.getElementById('adminUsers').textContent = admin;
        }

        function updateTable() {
            const tbody = document.getElementById('usersTableBody');
            const roleFilter = document.getElementById('roleFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            
            let filteredUsers = users;
            if (roleFilter) filteredUsers = filteredUsers.filter(u => u.role === roleFilter);
            if (statusFilter) filteredUsers = filteredUsers.filter(u => u.is_active.toString() === statusFilter);

            tbody.innerHTML = filteredUsers.map(user => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">${user.full_name}</div>
                        <div class="text-sm text-gray-500">@${user.username}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${user.email || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 text-xs font-semibold rounded-full role-${user.role}">
                            ${user.role === 'admin' ? '👑 Admin' : '👤 User'}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 text-xs font-semibold rounded-full status-${user.is_active ? 'active' : 'inactive'}">
                            ${user.is_active ? '✅ Hoạt động' : '❌ Vô hiệu hóa'}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${user.last_login ? new Date(user.last_login).toLocaleString('vi-VN') : 'Chưa đăng nhập'}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="viewUser(${user.id})" class="text-blue-600 hover:text-blue-900 mr-3">Xem</button>
                        <button onclick="editUser(${user.id})" class="text-green-600 hover:text-green-900 mr-3">Sửa</button>
                        <button onclick="deleteUser(${user.id})" class="text-red-600 hover:text-red-900">Xóa</button>
                    </td>
                </tr>
            `).join('');
        }

        function setupEventListeners() {
            document.getElementById('roleFilter').addEventListener('change', updateTable);
            document.getElementById('statusFilter').addEventListener('change', updateTable);
        }

        function refreshUsers() {
            if (isLoading) return;
            loadUsers();
        }

        // Modal functions
        function closeUserModal() {
            document.getElementById('userModal').classList.add('hidden');
            currentUser = null;
        }

        function closeUserFormModal() {
            document.getElementById('userFormModal').classList.add('hidden');
            document.getElementById('userForm').reset();
            currentUser = null;
        }

        function addNewUser() {
            document.getElementById('userFormTitle').textContent = 'Thêm User mới';
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('userPassword').required = true;
            document.getElementById('passwordFields').style.display = 'block';
            currentUser = null;
            document.getElementById('userFormModal').classList.remove('hidden');
        }

        function viewUser(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;
            
            currentUser = user;
            const details = document.getElementById('userDetails');
            details.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm font-medium text-gray-500">ID</label>
                        <p class="text-lg font-semibold text-gray-900">${user.id}</p>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-500">Username</label>
                        <p class="text-lg font-semibold text-gray-900">@${user.username}</p>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-500">Họ tên</label>
                        <p class="text-lg text-gray-900">${user.full_name}</p>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-500">Email</label>
                        <p class="text-lg text-gray-900">${user.email || 'Chưa có'}</p>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-500">Role</label>
                        <p class="text-lg"><span class="px-2 py-1 text-xs font-semibold rounded-full role-${user.role}">${user.role === 'admin' ? '👑 Admin' : '👤 User'}</span></p>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-500">Trạng thái</label>
                        <p class="text-lg"><span class="px-2 py-1 text-xs font-semibold rounded-full status-${user.is_active ? 'active' : 'inactive'}">${user.is_active ? '✅ Hoạt động' : '❌ Vô hiệu hóa'}</span></p>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-500">Lần đăng nhập cuối</label>
                        <p class="text-lg text-gray-900">${user.last_login ? new Date(user.last_login).toLocaleString('vi-VN') : 'Chưa đăng nhập'}</p>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-500">Ngày tạo</label>
                        <p class="text-lg text-gray-900">${new Date(user.created_at).toLocaleDateString('vi-VN')}</p>
                    </div>
                </div>
            `;
            document.getElementById('userModal').classList.remove('hidden');
        }

        function editUser(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;
            
            currentUser = user;
            document.getElementById('userFormTitle').textContent = 'Chỉnh sửa User';
            document.getElementById('userId').value = user.id;
            document.getElementById('userUsername').value = user.username;
            document.getElementById('userFullName').value = user.full_name;
            document.getElementById('userEmail').value = user.email || '';
            document.getElementById('userRole').value = user.role;
            document.getElementById('userIsActive').checked = user.is_active;
            document.getElementById('userPassword').required = false;
            document.getElementById('passwordFields').style.display = 'block';
            
            document.getElementById('userFormModal').classList.remove('hidden');
        }

        function editUserFromModal() {
            if (!currentUser) return;
            editUser(currentUser.id);
            closeUserModal();
        }

        async function saveUser() {
            const form = document.getElementById('userForm');
            const userId = document.getElementById('userId').value;
            const isEdit = !!userId;
            
            const userData = {
                username: document.getElementById('userUsername').value,
                full_name: document.getElementById('userFullName').value,
                email: document.getElementById('userEmail').value,
                role: document.getElementById('userRole').value,
                is_active: document.getElementById('userIsActive').checked
            };

            const password = document.getElementById('userPassword').value;
            if (password) {
                userData.password = password;
            }

            if (!userData.username || !userData.full_name || !userData.role) {
                alert('Vui lòng điền đầy đủ thông tin bắt buộc');
                return;
            }

            try {
                const token = localStorage.getItem('authToken');
                const url = '/api/users/users';
                const method = isEdit ? 'PUT' : 'POST';
                
                if (isEdit) {
                    userData.id = userId;
                }

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    const result = await response.json();
                    alert(isEdit ? 'Cập nhật user thành công!' : 'Tạo user thành công!');
                    closeUserFormModal();
                    refreshUsers();
                } else {
                    const error = await response.json();
                    alert('Lỗi: ' + (error.error || 'Lỗi không xác định'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Lỗi khi lưu user');
            }
        }

        async function deleteUser(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;
            
            if (confirm(`Bạn có chắc chắn muốn xóa user "${user.full_name}" (@${user.username})?`)) {
                try {
                    const token = localStorage.getItem('authToken');
                    const response = await fetch('/api/users/users', {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            id: userId
                        })
                    });

                    if (response.ok) {
                        alert('Xóa user thành công!');
                        refreshUsers();
                    } else {
                        const error = await response.json();
                        alert('Lỗi: ' + (error.error || 'Lỗi không xác định'));
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Lỗi khi xóa user');
                }
            }
        }

        async function deleteUserFromModal() {
            if (!currentUser) return;
            await deleteUser(currentUser.id);
            closeUserModal();
        }

        function logout() {
            if (confirm('Bạn có chắc chắn muốn đăng xuất?')) {
                localStorage.removeItem('authToken');
                localStorage.removeItem('userInfo');
                window.location.href = '/login';
            }
        }
    </script>
</body>
</html>
