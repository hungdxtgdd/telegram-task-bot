<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Dự án - Task Management System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📁</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .priority-high { background-color: #fee2e2; color: #991b1b; }
        .priority-medium { background-color: #fef3c7; color: #92400e; }
        .priority-low { background-color: #d1fae5; color: #065f46; }
        .status-not_started { background-color: #f3f4f6; color: #374151; }
        .status-in_progress { background-color: #dbeafe; color: #1e40af; }
        .status-completed { background-color: #d1fae5; color: #065f46; }
        .status-on_hold { background-color: #fef3c7; color: #92400e; }
        .status-cancelled { background-color: #fee2e2; color: #991b1b; }
        .progress-bar { background: linear-gradient(to right, #3b82f6, #10b981); }
        .unit-disabled { background-color: #f3f4f6; color: #6b7280; cursor: not-allowed; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-semibold text-gray-900">
                        <i class="fas fa-project-diagram mr-2 text-indigo-600"></i>
                        Quản lý Dự án
                    </h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="userInfo" class="text-sm text-gray-700"></span>
                    <a href="/dashboard" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                        <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
                    </a>
                    <a href="/okrs" class="bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-700 transition">
                        <i class="fas fa-bullseye mr-2"></i>Quản lý OKRs
                    </a>
                    <a href="/tasks" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">
                        <i class="fas fa-tasks mr-2"></i>Quản lý Tasks
                    </a>
                    <button id="userManagementBtn" onclick="goToUserManagement()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition hidden">
                        <i class="fas fa-users mr-2"></i>Quản lý User
                    </button>
                    <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
                        <i class="fas fa-sign-out-alt mr-2"></i>Đăng xuất
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Quick Actions -->
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Quick Actions</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <button onclick="showAddProjectModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition flex items-center justify-center">
                    <i class="fas fa-plus mr-2"></i>Thêm Dự án
                </button>
                <button onclick="refreshData()" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition flex items-center justify-center">
                    <i class="fas fa-sync-alt mr-2"></i>Refresh
                </button>
                <a href="/tasks" class="bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-700 transition flex items-center justify-center">
                    <i class="fas fa-tasks mr-2"></i>Quản lý Tasks
                </a>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Bộ lọc</h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <select id="okrFilter" class="border border-gray-300 rounded-md px-3 py-2 text-sm">
                    <option value="">Tất cả OKRs</option>
                </select>
                <select id="statusFilter" class="border border-gray-300 rounded-md px-3 py-2 text-sm">
                    <option value="">Tất cả Trạng thái</option>
                    <option value="Not Started">Chưa bắt đầu</option>
                    <option value="In Progress">Đang thực hiện</option>
                    <option value="Completed">Hoàn thành</option>
                    <option value="On Hold">Tạm dừng</option>
                    <option value="Cancelled">Hủy bỏ</option>
                </select>
                <select id="priorityFilter" class="border border-gray-300 rounded-md px-3 py-2 text-sm">
                    <option value="">Tất cả Ưu tiên</option>
                    <option value="High">Cao</option>
                    <option value="Medium">Trung bình</option>
                    <option value="Low">Thấp</option>
                </select>
                <button onclick="applyFilters()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
                    <i class="fas fa-filter mr-2"></i>Áp dụng
                </button>
            </div>
        </div>

        <!-- Projects List -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-900">Danh sách Dự án</h3>
            </div>
            <div id="projectsContainer" class="p-6">
                <div class="text-center py-8">
                    <i class="fas fa-spinner fa-spin text-2xl text-gray-400 mb-4"></i>
                    <p class="text-gray-500">Đang tải dữ liệu...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Project Modal -->
    <div id="projectModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 z-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-900" id="modalTitle">Thêm Dự án Mới</h3>
                </div>
                <form id="projectForm" class="p-6 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Tên dự án *</label>
                        <input type="text" id="projectName" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Mô tả</label>
                        <textarea id="projectDescription" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">OKR</label>
                            <select id="projectOKR" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">Chọn OKR</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Trạng thái</label>
                            <select id="projectStatus" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="active">Hoạt động</option>
                                <option value="completed">Hoàn thành</option>
                                <option value="on_hold">Tạm dừng</option>
                                <option value="cancelled">Hủy bỏ</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Ưu tiên</label>
                            <select id="projectPriority" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="High">Cao</option>
                                <option value="Medium" selected>Trung bình</option>
                                <option value="Low">Thấp</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Ngày bắt đầu</label>
                            <input type="date" id="projectStartDate" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Ngày kết thúc</label>
                            <input type="date" id="projectEndDate" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Mục tiêu tổng thể</label>
                            <input type="number" id="projectTargetValue" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="100">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Thực tế</label>
                            <input type="number" id="projectCurrentValue" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Đơn vị đo lường
                                <span class="text-xs text-gray-500 ml-1" title="Tự động lấy từ OKR khi chọn OKR">(tự động từ OKR)</span>
                            </label>
                            <select id="projectUnit" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="%">%</option>
                                <option value="VND">VND</option>
                                <option value="USD">USD</option>
                                <option value="số lượng">Số lượng</option>
                                <option value="giờ">Giờ</option>
                                <option value="ngày">Ngày</option>
                                <option value="tuần">Tuần</option>
                                <option value="tháng">Tháng</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Ngân sách</label>
                            <input type="number" id="projectBudget" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    
                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" onclick="closeProjectModal()" class="px-4 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition">
                            Hủy
                        </button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                            Lưu
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let projects = [];
        let okrs = [];
        let currentProject = null;
        let isLoading = false;

        // Load data on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            setupEventListeners();
        });

        async function checkAuth() {
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    window.location.href = '/login';
                    return;
                }

                const response = await fetch('/api/auth/verify', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;
                    document.getElementById('userInfo').textContent = `Xin chào, ${data.user.name}`;
                    
                    // Show user management button for admin
                    if (data.user.role === 'admin') {
                        document.getElementById('userManagementBtn').classList.remove('hidden');
                    }
                    
                    // Setup role-based UI
                    setupRoleBasedUI();
                    
                    loadData();
                } else {
                    localStorage.removeItem('token');
                    localStorage.removeItem('userInfo');
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                localStorage.removeItem('token');
                localStorage.removeItem('userInfo');
                window.location.href = '/login';
            }
        }

        function setupEventListeners() {
            document.getElementById('projectForm').addEventListener('submit', handleProjectSubmit);
            document.getElementById('okrFilter').addEventListener('change', applyFilters);
            document.getElementById('statusFilter').addEventListener('change', applyFilters);
            document.getElementById('priorityFilter').addEventListener('change', applyFilters);
        }

        // Go to user management page
        function goToUserManagement() {
            window.location.href = '/admin-users';
        }

        function setupRoleBasedUI() {
            // Hide project management buttons for regular users
            if (currentUser.role === 'user') {
                const addProjectBtn = document.querySelector('button[onclick="showAddProjectModal()"]');
                if (addProjectBtn) {
                    addProjectBtn.style.display = 'none';
                }
            }
        }

        async function loadData() {
            await Promise.all([
                loadProjects(),
                loadOKRs()
            ]);
        }

        async function loadProjects() {
            if (isLoading) return;
            
            isLoading = true;
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/projects-enhanced/projects', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    projects = await response.json();
                    renderProjects();
                } else {
                    console.error('Error loading projects:', await response.text());
                }
            } catch (error) {
                console.error('Error loading projects:', error);
            } finally {
                isLoading = false;
            }
        }

        async function loadOKRs() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/okrs-enhanced/okrs', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    okrs = await response.json();
                    updateOKRFilter();
                }
            } catch (error) {
                console.error('Error loading OKRs:', error);
            }
        }

        function updateOKRFilter() {
            const okrFilter = document.getElementById('okrFilter');
            const projectOKR = document.getElementById('projectOKR');
            
            [okrFilter, projectOKR].forEach(select => {
                if (select) {
                    select.innerHTML = '<option value="">Chọn OKR</option>';
                    okrs.forEach(okr => {
                        const option = document.createElement('option');
                        option.value = okr.id;
                        option.textContent = okr.objective;
                        option.dataset.unit = okr.unit || '%'; // Store unit in dataset
                        select.appendChild(option);
                    });
                }
            });
            
            // Add event listener for OKR selection in project form
            if (projectOKR) {
                projectOKR.addEventListener('change', function() {
                    const selectedOKRId = this.value;
                    const selectedOption = this.options[this.selectedIndex];
                    const unitSelect = document.getElementById('projectUnit');
                    
                    if (selectedOKRId && selectedOption.dataset.unit) {
                        // Set unit from selected OKR
                        unitSelect.value = selectedOption.dataset.unit;
                        unitSelect.disabled = true; // Disable manual unit selection
                        unitSelect.classList.add('unit-disabled');
                    } else {
                        // No OKR selected, enable manual unit selection
                        unitSelect.disabled = false;
                        unitSelect.classList.remove('unit-disabled');
                    }
                });
            }
        }

        function renderProjects() {
            const container = document.getElementById('projectsContainer');
            
            if (projects.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-project-diagram text-4xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 text-lg">Chưa có dự án nào</p>
                        <button onclick="showAddProjectModal()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                            <i class="fas fa-plus mr-2"></i>Tạo dự án đầu tiên
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = projects.map(project => {
                const progress = project.task_count > 0 ? (project.completed_tasks / project.task_count) * 100 : 0;
                const okr = okrs.find(o => o.id === project.okr_id);
                
                return `
                    <div class="border border-gray-200 rounded-lg p-6 mb-4 hover:shadow-md transition">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-lg font-semibold text-gray-900">${project.project_name}</h3>
                                <p class="text-sm text-gray-500">${project.project_code}</p>
                                ${okr ? `<p class="text-sm text-indigo-600">OKR: ${okr.objective}</p>` : ''}
                            </div>
                            <div class="flex space-x-2">
                                <span class="px-2 py-1 text-xs font-semibold rounded-full priority-${project.priority.toLowerCase()}">
                                    ${getPriorityText(project.priority)}
                                </span>
                                <span class="px-2 py-1 text-xs font-semibold rounded-full status-${project.status.toLowerCase().replace(' ', '_')}">
                                    ${getStatusText(project.status)}
                                </span>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <div class="flex justify-between text-sm text-gray-600 mb-1">
                                <span>Tiến độ</span>
                                <span>${Math.round(progress)}%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="progress-bar h-2 rounded-full" style="width: ${progress}%"></div>
                            </div>
                        </div>
                        
                        <div class="flex justify-between items-center text-sm text-gray-500 mb-4">
                            <span><i class="fas fa-tasks mr-1"></i>${project.task_count} tasks</span>
                            <span><i class="fas fa-users mr-1"></i>${project.member_count} thành viên</span>
                            <span><i class="fas fa-calendar mr-1"></i>${project.deadline ? new Date(project.deadline).toLocaleDateString('vi-VN') : 'Chưa có deadline'}</span>
                        </div>
                        
                        <div class="flex justify-between items-center">
                            <div class="text-sm text-gray-500">
                                ${project.target_value ? `Mục tiêu: ${project.target_value} ${project.unit || ''}` : ''}
                                ${project.current_value ? ` | Thực tế: ${project.current_value} ${project.unit || ''}` : ''}
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="viewProjectTasks(${project.id})" class="text-orange-600 hover:text-orange-800 text-sm font-medium">
                                    <i class="fas fa-tasks mr-1"></i>Tasks
                                </button>
                                <button onclick="editProject(${project.id})" class="text-blue-600 hover:text-blue-800 text-sm font-medium">
                                    <i class="fas fa-edit mr-1"></i>Sửa
                                </button>
                                <button onclick="deleteProject(${project.id})" class="text-red-600 hover:text-red-800 text-sm font-medium">
                                    <i class="fas fa-trash mr-1"></i>Xóa
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getPriorityText(priority) {
            const priorityMap = {
                'High': 'Cao',
                'Medium': 'Trung bình',
                'Low': 'Thấp'
            };
            return priorityMap[priority] || priority;
        }

        function getStatusText(status) {
            const statusMap = {
                'Not Started': 'Chưa bắt đầu',
                'In Progress': 'Đang thực hiện',
                'Completed': 'Hoàn thành',
                'On Hold': 'Tạm dừng',
                'Cancelled': 'Hủy bỏ'
            };
            return statusMap[status] || status;
        }

        function showAddProjectModal() {
            currentProject = null;
            document.getElementById('modalTitle').textContent = 'Thêm Dự án Mới';
            document.getElementById('projectForm').reset();
            
            // Enable unit selection for new project
            const unitSelect = document.getElementById('projectUnit');
            unitSelect.disabled = false;
            unitSelect.classList.remove('unit-disabled');
            
            document.getElementById('projectModal').classList.remove('hidden');
        }

        function editProject(projectId) {
            currentProject = projects.find(p => p.id === projectId);
            if (!currentProject) return;

            document.getElementById('modalTitle').textContent = 'Sửa Dự án';
            document.getElementById('projectName').value = currentProject.project_name;
            document.getElementById('projectDescription').value = currentProject.description || '';
            document.getElementById('projectOKR').value = currentProject.okr_id || '';
            document.getElementById('projectStatus').value = currentProject.status;
            document.getElementById('projectPriority').value = currentProject.priority;
            
            // Set unit based on selected OKR - use setTimeout to ensure OKR dropdown is populated
            setTimeout(() => {
                const okrSelect = document.getElementById('projectOKR');
                const unitSelect = document.getElementById('projectUnit');
                if (currentProject.okr_id) {
                    const selectedOption = okrSelect.options[okrSelect.selectedIndex];
                    if (selectedOption && selectedOption.dataset.unit) {
                        unitSelect.value = selectedOption.dataset.unit;
                        unitSelect.disabled = true;
                        unitSelect.classList.add('unit-disabled');
                    } else {
                        // Fallback: find OKR in okrs array and set unit
                        const okr = okrs.find(o => o.id == currentProject.okr_id);
                        if (okr && okr.unit) {
                            unitSelect.value = okr.unit;
                            unitSelect.disabled = true;
                            unitSelect.classList.add('unit-disabled');
                        }
                    }
                } else {
                    unitSelect.disabled = false;
                    unitSelect.classList.remove('unit-disabled');
                }
            }, 100);
            // Format dates for input type="date" (YYYY-MM-DD)
            const startDate = currentProject.start_date ? currentProject.start_date.split('T')[0] : '';
            const endDate = currentProject.end_date ? currentProject.end_date.split('T')[0] : '';
            document.getElementById('projectStartDate').value = startDate;
            document.getElementById('projectEndDate').value = endDate;
            document.getElementById('projectTargetValue').value = currentProject.target_value || '';
            document.getElementById('projectCurrentValue').value = currentProject.current_value || '';
            document.getElementById('projectUnit').value = currentProject.unit || '%';
            document.getElementById('projectBudget').value = currentProject.budget || '';
            
            document.getElementById('projectModal').classList.remove('hidden');
        }

        function closeProjectModal() {
            document.getElementById('projectModal').classList.add('hidden');
            currentProject = null;
        }

        async function handleProjectSubmit(e) {
            e.preventDefault();
            
            const formData = {
                project_name: document.getElementById('projectName').value,
                description: document.getElementById('projectDescription').value,
                okr_id: document.getElementById('projectOKR').value || null,
                status: document.getElementById('projectStatus').value,
                priority: document.getElementById('projectPriority').value,
                start_date: document.getElementById('projectStartDate').value || null,
                end_date: document.getElementById('projectEndDate').value || null,
                target_value: document.getElementById('projectTargetValue').value || null,
                current_value: document.getElementById('projectCurrentValue').value || null,
                unit: document.getElementById('projectUnit').value || '%',
                budget: document.getElementById('projectBudget').value || null
            };

            try {
                const token = localStorage.getItem('token');
                const url = currentProject ? `/api/projects-enhanced/projects/${currentProject.id}` : '/api/projects-enhanced/projects';
                const method = currentProject ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    closeProjectModal();
                    loadProjects();
                } else {
                    const error = await response.json();
                    alert('Lỗi: ' + error.error);
                }
            } catch (error) {
                console.error('Error saving project:', error);
                alert('Lỗi khi lưu dự án');
            }
        }

        async function deleteProject(projectId) {
            if (!confirm('Bạn có chắc chắn muốn xóa dự án này?')) return;

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/projects-enhanced/projects/${projectId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    loadProjects();
                } else {
                    const error = await response.json();
                    alert('Lỗi: ' + error.error);
                }
            } catch (error) {
                console.error('Error deleting project:', error);
                alert('Lỗi khi xóa dự án');
            }
        }

        function viewProjectTasks(projectId) {
            window.location.href = `/tasks?project_id=${projectId}`;
        }

        function applyFilters() {
            const okrFilter = document.getElementById('okrFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const priorityFilter = document.getElementById('priorityFilter').value;

            let filteredProjects = projects;

            if (okrFilter) {
                filteredProjects = filteredProjects.filter(p => p.okr_id == okrFilter);
            }
            if (statusFilter) {
                filteredProjects = filteredProjects.filter(p => p.status === statusFilter);
            }
            if (priorityFilter) {
                filteredProjects = filteredProjects.filter(p => p.priority === priorityFilter);
            }

            // Temporarily replace projects array for rendering
            const originalProjects = projects;
            projects = filteredProjects;
            renderProjects();
            projects = originalProjects;
        }

        function refreshData() {
            loadData();
        }


        function logout() {
            if (confirm('Bạn có chắc chắn muốn đăng xuất?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('userInfo');
                window.location.href = '/login';
            }
        }
    </script>
</body>
</html>
