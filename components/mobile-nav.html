<!-- JavaScript for Mobile Menu -->
<script>
// Mobile menu functions
function toggleMobileMenu() {
  const menu = document.getElementById('mobile-menu');
  const overlay = document.getElementById('mobile-menu-overlay');
  
  if (menu.classList.contains('-translate-x-full')) {
    menu.classList.remove('-translate-x-full');
    overlay.classList.remove('hidden');
    document.body.classList.add('overflow-hidden');
  } else {
    closeMobileMenu();
  }
}

function closeMobileMenu() {
  const menu = document.getElementById('mobile-menu');
  const overlay = document.getElementById('mobile-menu-overlay');
  
  menu.classList.add('-translate-x-full');
  overlay.classList.add('hidden');
  document.body.classList.remove('overflow-hidden');
}

// Update user info
function updateUserInfo(user) {
  const mobileName = document.getElementById('mobile-user-name');
  const mobileRole = document.getElementById('mobile-user-role');
  const desktopName = document.getElementById('desktop-user-name');
  const desktopRole = document.getElementById('desktop-user-role');
  
  if (mobileName) mobileName.textContent = user.name || user.full_name || 'User';
  if (mobileRole) mobileRole.textContent = user.role || 'User';
  if (desktopName) desktopName.textContent = user.name || user.full_name || 'User';
  if (desktopRole) desktopRole.textContent = user.role || 'User';
  
  // Show/hide admin links
  const usersLinks = document.querySelectorAll('#mobile-users-link, #desktop-users-link');
  usersLinks.forEach(link => {
    if (user.role === 'admin') {
      link.classList.remove('hidden');
    } else {
      link.classList.add('hidden');
    }
  });
}

// Update badge counts
function updateBadgeCounts(counts) {
  const badges = {
    'mobile-users-badge': counts.users || 0,
    'mobile-okrs-badge': counts.okrs || 0,
    'mobile-projects-badge': counts.projects || 0,
    'mobile-tasks-badge': counts.tasks || 0,
    'desktop-users-badge': counts.users || 0,
    'desktop-okrs-badge': counts.okrs || 0,
    'desktop-projects-badge': counts.projects || 0,
    'desktop-tasks-badge': counts.tasks || 0
  };
  
  Object.entries(badges).forEach(([id, count]) => {
    const element = document.getElementById(id);
    if (element) {
      element.textContent = count;
      element.style.display = count > 0 ? 'inline-flex' : 'none';
    }
  });
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  // Ctrl/Cmd + M to toggle mobile menu
  if ((e.ctrlKey || e.metaKey) && e.key === 'm') {
    e.preventDefault();
    toggleMobileMenu();
  }
  
  // Escape to close mobile menu
  if (e.key === 'Escape') {
    closeMobileMenu();
  }
});

// Close mobile menu when clicking on links
document.addEventListener('click', function(e) {
  if (e.target.closest('a[href]')) {
    closeMobileMenu();
  }
});
</script>
